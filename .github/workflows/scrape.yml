name: Monitor DOE-BA DEPAF

# O agendamento automático (cron) foi desligado de propósito: o site do
# Diário Oficial bloqueia conexões vindas de servidores de nuvem, então essa
# tentativa sempre falhava. A busca diária agora roda no computador
# Cíntia (ver LEIA-ME.md). Este workflow fica só como registro / pra rodar
# manualmente se algum dia quisermos testar de novo.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install

      - name: Rodar o robô
        run: node scraper.js

      - name: Salvar os dados atualizados no repositório
        run: |
          git config user.name "monitor-doe-depaf-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && echo "Nada novo hoje." || git commit -m "Atualiza dados do Diário ($(date -u +%Y-%m-%d))"
          git push
